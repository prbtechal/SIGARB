# SIGARB — vhost Apache para a VM .8 (MODELO; aplicar só com aprovação e janela avisada ao Escalas).
# Isolado por ServerName: NÃO altera o vhost padrão de *:80 (Escalas). Exige DNS sigarb.prb.intra e certificado.
<VirtualHost *:80>
  ServerName sigarb.prb.intra
  Redirect permanent / https://sigarb.prb.intra/
</VirtualHost>
<VirtualHost *:443>
  ServerName sigarb.prb.intra
  SSLEngine on
  SSLCertificateFile    /etc/ssl/certs/sigarb.prb.intra.crt     # emitido pela AC institucional
  SSLCertificateKeyFile /etc/ssl/private/sigarb.prb.intra.key
  SSLProtocol -all +TLSv1.2 +TLSv1.3
  Header always set Strict-Transport-Security "max-age=31536000"
  DocumentRoot /var/www/app/sigarb/current/frontend
  <Directory /var/www/app/sigarb/current/frontend>
    Options -Indexes
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ /index.html [L]
  </Directory>
  <Files "index.html">
    Header set Cache-Control "no-store"
  </Files>
  # Somente o front controller é executável. SEM enablereuse (causa raiz dos 504 no CP-8).
  ProxyTimeout 35
  ProxyPassMatch "^/api/" "unix:/run/php/sigarb.sock|fcgi://sigarb/var/www/app/sigarb/current/backend/public/index.php"
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" "expr=%{REQUEST_URI} !~ m#^/api/#"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "same-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  ErrorLog  ${APACHE_LOG_DIR}/sigarb-erro.log
  CustomLog ${APACHE_LOG_DIR}/sigarb-acesso.log combined
</VirtualHost>
