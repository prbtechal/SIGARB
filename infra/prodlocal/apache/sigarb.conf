# SIGARB — Apache candidato: SPA estática + /api → PHP-FPM (mod_proxy_fcgi). Sem TLS (local); produção exige HTTPS/HSTS.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 40
KeepAliveTimeout 5
<IfModule mpm_event_module>
  StartServers 2
  ServerLimit 4
  ThreadsPerChild 50
  MaxRequestWorkers 200
</IfModule>

<Directory "/usr/local/apache2/htdocs">
  Options -Indexes
  AllowOverride None
  Require all granted
  RewriteEngine On
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteRule ^ /index.html [L]
</Directory>
<FilesMatch "\.(js|css|svg|woff2?)$">
  Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
<Files "index.html">
  Header set Cache-Control "no-store"
</Files>
AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

# CSP de produção (idêntica a frontend/csp.ts — ADR-012) e cabeçalhos de segurança
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" "expr=%{REQUEST_URI} !~ m#^/api/#"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
Header always set Cross-Origin-Opener-Policy "same-origin"

# API → PHP-FPM; o front controller é o único PHP executável. Nada de storage/ é exposto.
ProxyTimeout 35
# SEM enablereuse: com reuso, cada thread do Apache (até MaxRequestWorkers=200) prende uma conexão persistente
# a um filho do FPM (12), que fica dedicado e ocioso; conexões novas esperam no backlog até o ProxyTimeout
# (504 em 35 s, "script ''" no log do FPM). Evidência: docs/operacao/CAPACIDADE.md (CP-8).
ProxyPassMatch "^/api/" "fcgi://app:9000/var/www/sigarb/public/index.php"

# Status do FPM apenas na porta interna de observação (publicada só em 127.0.0.1)
Listen 8081
<VirtualHost *:8081>
  ProxyPass "/fpm-status" "fcgi://app:9000/fpm-status"
  ProxyPassReverse "/fpm-status" "fcgi://app:9000/fpm-status"
</VirtualHost>
