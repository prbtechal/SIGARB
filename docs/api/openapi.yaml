  /inventories: { get: { summary: 'RF-020 — lista no escopo (decisão 2026-11-18: exige inventario.ver)', responses: { '200': { description: ok } } }, post: { summary: 'Abrir inventário (local_estoque_id); um em curso por local', responses: { '201': { description: criado }, '409': { $ref: '#/components/responses/Erro' } } } }
  /inventories/{codigo}: { get: { summary: 'Detalhe com linhas e ações', parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }], responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } } }
  /inventories/{codigo}/counts: { put: { summary: 'Salvar contagens (contagens[id, contado], versao)', parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }], responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } } }
  /inventories/{codigo}/submit: { post: { summary: 'Enviar para aprovação (todas as linhas contadas)', parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }], requestBody: { content: { application/json: { schema: { type: object, required: [versao], properties: { versao: { type: integer } } } } } }, responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } } }
