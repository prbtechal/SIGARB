    get: { summary: 'Detalhe; solicitante ou atendimento no escopo; caso contrário 404 (sem enumeração). Notas internas só para atendimento', responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/Erro' } } }
    patch: { summary: 'Atendimento (suporte.atender): status (transições válidas), prioridade, atribuido_a_id; versao obrigatória', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '409': { description: CONFLITO_VERSAO }, '422': { description: 'TRANSICAO_INVALIDA, RESPONSAVEL_INVALIDO' } } }
  /support/tickets/{codigo}/messages:
    post: { summary: 'Mensagem PUBLICA (todos) ou INTERNA (só atendimento); throttle 20/min; encerrado = 409 CHAMADO_ENCERRADO', responses: { '201': { description: Criado }, '403': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } }
  /support/tickets/{codigo}/reopen:
    post: { summary: 'Reabrir RESOLVIDO (solicitante até 15 dias e 3 reaberturas; atendimento sempre); versao + motivo', responses: { '200': { description: ok }, '409': { description: CONFLITO_VERSAO }, '422': { description: 'NAO_REABRIVEL, PRAZO_REABERTURA, LIMITE_REABERTURA' } } }
  /support/tickets/{codigo}/agents:
    get: { summary: 'Atendentes elegíveis (com suporte.atender no escopo do chamado)', responses: { '200': { description: ok } } }
  /support/tickets/{codigo}/history:
    get: { summary: 'Eventos de auditoria do chamado (somente atendimento; sem texto livre)', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
  /support/queue:
    get: { summary: 'Fila de atendimento no escopo (status, prioridade, categoria, atribuido=eu|ninguem, q)', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
  /support/queue/summary:
    get: { summary: 'Contagens por situação, sem responsável e atribuídos a mim', responses: { '200': { description: ok } } }
  /notifications:
    get: { summary: 'Notificações in-app do próprio usuário (30 mais recentes + não lidas)', responses: { '200': { description: ok } } }
  /notifications/{id}/read:
    post: { summary: 'Marcar como lida (só do próprio usuário; alheia = 404)', responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/Erro' } } }
  /notifications/read-all:
    post: { summary: 'Marcar todas como lidas', responses: { '200': { description: ok } } }
  /central-suporte:
    get:
      summary: '2026-11-19 — Central de Suporte PRB (outro sistema): chamados e avisos do PRÓPRIO usuário, lidos (só SELECT) das views suporte.v_chamados_solicitante e v_notificacoes_solicitante. Qualquer usuário logado; o CPF é o da sessão (usuarios.login) — parâmetros do cliente são ignorados e o CPF não volta. Leitura desligada sem SUPORTE_DB_DATABASE; banco/view ausente = disponivel false (200). Cache 60 s por usuário; timeout 3 s; throttle 60/min. Links montados de SUPORTE_URL + codigo (só http/https). Não grava auditoria (só leitura).'
      responses:
        '200':
          description: 'Sempre 200 para sessão válida'
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponivel: { type: boolean }
                  abertos: { type: integer }
                  nao_lidos: { type: integer, description: 'Avisos pendentes na Central (somados ao sino)' }
                  url_abrir: { type: string, nullable: true, description: 'SUPORTE_URL/novo?sistema=ARSENAL' }
                  url_chamados: { type: string, nullable: true }
                  chamados: { type: array, maxItems: 10, items: { type: object, properties: { protocolo: { type: string }, titulo: { type: string }, sistema: { type: string }, status: { type: string }, status_rotulo: { type: string }, prioridade: { type: string }, aberto: { type: boolean }, aguardando_voce: { type: boolean }, criado_em: { type: string, nullable: true }, atualizado_em: { type: string, nullable: true }, link: { type: string, nullable: true } } } }
                  avisos: { type: array, maxItems: 10, items: { type: object, properties: { id: { type: integer }, protocolo: { type: string }, tipo: { type: string }, texto: { type: string }, criada_em: { type: string, nullable: true }, link: { type: string, nullable: true } } } }
        '401': { $ref: '#/components/responses/Erro' }
  /documents:
    get: { summary: 'RF-014 + 2026-11-19 — raiz de busca de documentos do escopo (documentos.ver). q palavra por palavra (sem acento) em título, arquivo, número, tipo, quem enviou e no registro ligado visível (origem/destinação, documento, material, nº de série, lote, "#id"). Cada item traz versao, substituido_por e registros [{movimentacao_id, tipo, origem, documento_referencia}] (só os visíveis com estoque.ver). Padrão versoes=ATUAIS (esconde versões substituídas)', parameters: [{ $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/per_page' }, { name: tipo_documento_id, in: query, schema: { type: integer } }, { name: unidade_id, in: query, schema: { type: integer } }, { name: situacao, in: query, schema: { enum: [ATIVO, ARQUIVADO] } }, { name: movimentacao_id, in: query, schema: { type: integer } }, { name: de, in: query, schema: { type: string, format: date } }, { name: ate, in: query, schema: { type: string, format: date } }, { name: meus, in: query, description: 'Só os enviados por mim', schema: { type: boolean } }, { name: registro_tipo, in: query, schema: { enum: [ENTRADA, SAIDA, BAIXA, OUTRO, SEM_REGISTRO] } }, { name: versoes, in: query, schema: { enum: [ATUAIS, TODAS] } }], responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
    post:
      summary: Enviar documento (multipart; PDF/PNG/JPG ≤ 10 MB; throttle 20/min)
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [arquivo, tipo_documento_id, unidade_id, titulo], properties: { arquivo: { type: string, format: binary }, tipo_documento_id: { type: integer }, unidade_id: { type: integer }, titulo: { type: string }, descricao: { type: string }, numero_referencia: { type: string }, movimentacao_id: { type: integer } } } } } }
      responses: { '201': { description: Criado }, '403': { $ref: '#/components/responses/Erro' }, '413': { $ref: '#/components/responses/Erro' }, '422': { description: 'TIPO_NAO_PERMITIDO, CONTEUDO_INCOMPATIVEL, CONTEUDO_MALFORMADO, CONTEUDO_ATIVO, CONTEUDO_NAO_VERIFICAVEL, ARQUIVO_VAZIO, ARQUIVO_GRANDE_DEMAIS, MOVIMENTACAO_INACESSIVEL, VALIDACAO' } }
  /documents/pending-records:
    get: { summary: '2026-11-19 — ENTRADA/SAIDA/BAIXA não estornadas sem documento, em locais com estoque.ver (sem depósito oculto) e unidade com documentos.enviar. pode_anexar = quem registrou ou documentos.gerir', parameters: [{ $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/per_page' }, { name: tipo, in: query, schema: { enum: [ENTRADA, SAIDA, BAIXA] } }, { name: meus, in: query, schema: { type: boolean } }], responses: { '200': { description: 'data [{id, tipo, ocorrido_em, origem, documento_referencia, local, itens_count, responsavel, pode_anexar}]' }, '403': { $ref: '#/components/responses/Erro' } } }
  /documents/{codigo}/versions:
    post:
      summary: '2026-11-19 — nova versão do documento (multipart; throttle 20/min). Só quem enviou, com documentos.enviar na unidade; documento ATIVO e sem versão mais nova. Herda tipo, unidade, título, número, descrição e vínculos; a anterior continua guardada (arquivo imutável). Auditoria documento.nova_versao'
      parameters: [{ name: codigo, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [arquivo], properties: { arquivo: { type: string, format: binary }, descricao: { type: string, maxLength: 500 } } } } } }
      responses: { '201': { description: 'Documento (versao, versao_anterior)' }, '403': { description: 'VERSAO_SO_DE_QUEM_ENVIOU / ACESSO_NEGADO' }, '404': { $ref: '#/components/responses/Erro' }, '409': { description: 'JA_TEM_VERSAO_NOVA, DOCUMENTO_ARQUIVADO' }, '422': { description: 'Mesma validação de conteúdo do envio' } }
  /movements/{id}/documents:
    post:
      summary: '2026-11-19 — anexar documento a um registro já salvo (anexo opcional da entrada/saída ou registro salvo sem documento). Multipart; throttle 20/min. Unidade do documento = unidade do local do registro; tipo padrão NOTA_RECEBIMENTO (entrada) / TERMO (saída, baixa); título padrão "<Registro> #id — <documento>"; número padrão = documento_referencia. Fora do escopo 404 (auditado documento.anexo_negado); sem documentos.enviar 403; registro de outra pessoa sem documentos.gerir 403 ANEXO_SO_RESPONSAVEL'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [arquivo], properties: { arquivo: { type: string, format: binary }, tipo_documento_id: { type: integer }, titulo: { type: string }, numero_referencia: { type: string }, descricao: { type: string } } } } } }
      responses: { '201': { description: Documento }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '422': { description: 'TIPO_NAO_PERMITIDO, CONTEUDO_INCOMPATIVEL, CONTEUDO_MALFORMADO, CONTEUDO_ATIVO, CONTEUDO_NAO_VERIFICAVEL, ARQUIVO_VAZIO, ARQUIVO_GRANDE_DEMAIS, VALIDACAO' } }
  /documents/{codigo}:
    parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }]
    get: { summary: Detalhe (auditado como consulta sensível); fora do escopo = 404, responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/Erro' } } }
    put: { summary: 'Metadados (titulo, descricao, numero_referencia, tipo_documento_id); arquivo/unidade imutáveis', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } }
  /documents/{codigo}/download:
    parameters: [{ name: codigo, in: path, required: true, schema: { type: string } }]
    get: { summary: 'Download como anexo (checksum verificado, nosniff, CSP sandbox, no-store); auditado', responses: { '200': { description: arquivo }, '404': { $ref: '#/components/responses/Erro' }, '409': { description: 'INTEGRIDADE_VIOLADA ou ARQUIVO_INDISPONIVEL' } } }
  /documents/{codigo}/archive: { post: { summary: Arquivar (justificativa ≥ 10), parameters: [{ name: codigo, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } } }
  /documents/{codigo}/reactivate: { post: { summary: Reativar (justificativa ≥ 10), parameters: [{ name: codigo, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } } }
  /documents/{codigo}/links: { post: { summary: Vincular a movimentação no escopo (imutável), parameters: [{ name: codigo, in: path, required: true, schema: { type: string } }], responses: { '201': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } } }
  /militares/{id}/foto:
    get: { summary: 'Foto do perfil do efetivo (sessão + escopo; privada)', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: 'image/jpeg ou image/png' }, '404': { $ref: '#/components/responses/Erro' } } }
    post: { summary: 'Enviar/trocar foto (multipart "foto", JPG/PNG até 3 MB; metadados removidos no servidor; militares.gerir)', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } }
    delete: { summary: 'Remover foto (militares.gerir)', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } }
  # Portal do efetivo (decisão do responsável, 2026-11-18) — docs/operacao/PORTAL-EFETIVO.md. {codigo} = ULID público.
  /portal/summary:
    get: { summary: 'Início do efetivo (portal.efetivo): dados do efetivo, pedidos em aberto, limite, material com ele (total e atrasados). Conta sem efetivo ligado = sem_vinculo', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
  /portal/catalog:
    get: { summary: 'Catálogo para o pedido: materiais ativos com `bloqueio` (motivo) para arma de fogo/munição de quem não pode; locais de retirada da unidade e das superiores', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '422': { description: SEM_EFETIVO } } }
  /portal/material:
    get: { summary: 'Material comigo: entregas pendentes de devolução (previsão, atrasado) e acautelamentos ativos do próprio efetivo', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
  /portal/requests:
    get: { summary: 'Meus pedidos (status opcional), paginado', parameters: [{ $ref: '#/components/parameters/page' }, { name: status, in: query, schema: { enum: [PENDENTE, APROVADO, RECUSADO, CANCELADO, ENTREGUE] } }], responses: { '200': { description: ok } } }
    post:
      summary: 'Criar pedido (throttle 10/min). Individual = 1 por linha; letal só para RR/PM/BM da ativa (422 EFETIVO_NAO_APTO_LETAL); limite de pedidos abertos (422 LIMITE_PEDIDOS); retirada até 60 dias; local da unidade (422 LOCAL_INVALIDO)'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [itens], properties: { itens: { type: array, minItems: 1, maxItems: 20, items: { type: object, required: [material_id, quantidade], properties: { material_id: { type: integer }, quantidade: { type: integer, minimum: 1, maximum: 1000 } } } }, retirada_prevista: { type: string, format: date }, local_retirada_id: { type: integer }, observacao: { type: string, maxLength: 500 } } } } } }
      responses: { '201': { description: Pedido }, '403': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } }
  /portal/requests/{codigo}:
    get: { summary: 'Detalhe do próprio pedido (de outro efetivo = 404)', parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }], responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/Erro' } } }
  /portal/requests/{codigo}/cancel:
    post: { summary: 'Cancelar o próprio pedido {versao, motivo?} enquanto PENDENTE ou APROVADO (409 TRANSICAO_INVALIDA / VERSAO_DESATUALIZADA)', parameters: [{ name: codigo, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } }
  /material-requests:
    get: { summary: 'Painel do armeiro (pedidos.gerir, escopo da unidade do efetivo): status, q (efetivo ou código PED-XXXXXX), de, ate, militar_id', parameters: [{ $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/page' }, { name: status, in: query, schema: { type: string } }, { name: de, in: query, schema: { type: string, format: date } }, { name: ate, in: query, schema: { type: string, format: date } }], responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
  /material-requests/summary:
    get: { summary: 'Contadores do menu: pendentes e aprovados aguardando retirada (sem filtro) e pendente_mais_antigo; por_status (2026-11-18, abas do painel) com os mesmos filtros da lista (q, de, ate, militar_id)', responses: { '200': { description: ok } } }
  /material-requests/{codigo}:
    get: { summary: 'Detalhe + efetivo_conferencia (foto, nome, posto, matrícula conforme permissão, CPF mascarado, aptidão) + acoes; fora do escopo = 404', parameters: [{ name: codigo, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/Erro' } } }
  /material-requests/{codigo}/decision:
    post:
      summary: 'Aprovar (itens[].quantidade_aprovada ≤ pedida; observacao) ou recusar (motivo ≥ 5, 422 MOTIVO_OBRIGATORIO). Revalida aptidão letal; arma de fogo exige acautelamento.aprovar; quem pediu não decide (salvo papéis de autoaprovação)'
      parameters: [{ name: codigo, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decisao, versao], properties: { decisao: { enum: [APROVAR, RECUSAR] }, versao: { type: integer }, motivo: { type: string }, observacao: { type: string }, itens: { type: array, items: { type: object, properties: { id: { type: integer }, quantidade_aprovada: { type: integer, minimum: 0 } } } } } } } } }
      responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } }
  /material-requests/{codigo}/delivery:
    post:
      summary: 'Entregar pedido APROVADO (pedidos.gerir + estoque.entregar no local; arma de fogo + acautelamento.operar). Arma de fogo (perfil ARMA_FOGO) = um acautelamento por item (com carteira); demais = uma ENTREGA (POST /movements). Entrega única: o não entregue fica registrado. Idempotente (mesma chave = 200 Idempotent-Replayed; outra = 409 JA_ENTREGUE)'
      parameters: [{ name: codigo, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/idem' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [versao, local_id, linhas], properties: { versao: { type: integer }, local_id: { type: integer }, previsao_retorno: { type: string, format: date, description: 'ausente = consumo' }, linhas: { type: array, items: { type: object, required: [id], properties: { id: { type: integer }, itens: { type: array, items: { type: integer } }, lotes: { type: array, items: { type: object, properties: { lote_id: { type: integer }, quantidade: { type: integer } } } } } } } } } } } }
      responses: { '201': { description: Entregue }, '200': { description: Repetição idempotente }, '409': { $ref: '#/components/responses/Erro' }, '422': { description: 'ACIMA_DO_APROVADO, NADA_A_ENTREGAR, ITEM_INVALIDO, EFETIVO_NAO_APTO_LETAL' }, '428': { $ref: '#/components/responses/Erro' } }
