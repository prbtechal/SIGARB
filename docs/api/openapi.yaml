openapi: 3.1.0
info:
  title: SIGARB API
  version: 0.1.0-mvp
  description: |
    API do MVP (ambiente NÃO produtivo). Autenticação por cookie de sessão (grupo "web" do Laravel).
    Escritas exigem cabeçalho X-XSRF-TOKEN (valor do cookie XSRF-TOKEN; obter em GET /csrf).
    Escritas de estoque exigem Idempotency-Key. Erros: objeto `error` padronizado.
    Datas/horas (ADR-015): respostas em ISO 8601 com offset de Maceió (ex.: 2026-11-19T14:46:00-03:00); entradas
    `date-time` devem trazer o fuso (sem fuso = hora de Maceió). Datas puras (AAAA-MM-DD) são dias de Maceió.
    GET /health/ready inclui a verificação `fuso` (sessão do banco no mesmo offset do app).
servers: [{ url: /api/v1 }]
security: [{ sessao: [] }]
components:
  securitySchemes:
    sessao: { type: apiKey, in: cookie, name: sigarb-session }
  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    per_page: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    q: { name: q, in: query, schema: { type: string, maxLength: 80 } }
    idem: { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9-]{16,80}$' } }
  schemas:
    Erro:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [VALIDACAO, NAO_AUTENTICADO, CONTA_INATIVA, CREDENCIAIS_INVALIDAS, MUITAS_TENTATIVAS, ACESSO_NEGADO, NAO_ENCONTRADO, CSRF_INVALIDO, OPERACAO_BLOQUEADA, IDEMPOTENCY_KEY_OBRIGATORIA, IDEMPOTENCIA_CONFLITO, IDENTIFICADOR_DUPLICADO, SALDO_INSUFICIENTE, JA_ESTORNADA, ESTORNO_INVALIDO, ESTORNO_IMPEDIDO, MODO_CONTROLE_IMUTAVEL, LOCAL_INATIVO, ERRO_INTERNO] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
            details: { type: object }
            request_id: { type: string }
    Meta: { type: object, properties: { page: { type: integer }, per_page: { type: integer }, total: { type: integer }, last_page: { type: integer } } }
    Entrada:
      type: object
      required: [tipo, local_destino_id, origem_descricao, documento_referencia, itens]
      properties:
        tipo: { type: string, enum: [ENTRADA], description: 'Outros tipos → 409 OPERACAO_BLOQUEADA' }
        local_destino_id: { type: integer }
        origem_descricao: { type: string, minLength: 3, maxLength: 255 }
        documento_referencia: { type: string, minLength: 3, maxLength: 120 }
        justificativa: { type: [string, 'null'], maxLength: 500, description: 'Obrigatória quando ocorrido_em é retroativa' }
        ocorrido_em: { type: [string, 'null'], format: date-time, description: 'Data/hora real da entrada (com fuso). Ausente = agora. Até 5 min no futuro; anterior a 5 min atrás = retroativa (exige justificativa, auditada)' }
        itens:
          type: array
          minItems: 1
          maxItems: 200
          items:
            oneOf:
              - { title: Individual, type: object, required: [material_id], description: 'identificador é gerado pelo sistema (prefixo da categoria + sequência, ex.: ARM-000001); enviá-lo → 422', properties: { material_id: { type: integer }, numero_serie: { type: [string, 'null'] }, estado_conservacao: { enum: [NOVO, BOM, REGULAR, RUIM] } } }
              - { title: Lote, type: object, required: [material_id, lote_codigo, quantidade], properties: { material_id: { type: integer }, lote_codigo: { type: string }, validade: { type: [string, 'null'], format: date }, quantidade: { type: integer, minimum: 1 } } }
  responses:
    Erro: { description: Erro padronizado, content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }
    Bloqueada: { description: 'Operação bloqueada por pendência institucional (OPERACAO_BLOQUEADA)', content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }
paths:
  /csrf: { get: { security: [], summary: Emite cookie XSRF-TOKEN, responses: { '204': { description: ok } } } }
  /auth/login:
    post:
      security: []
      summary: 'RF-001 Autenticar (emite cookie de sessão e de dispositivo confiável). Com MFA ativo devolve {mfa_requerido: true} sem sessão; conta bloqueada (PSI-PRB 10.3) recebe o mesmo 401 genérico; 403 SENHA_CPF_PRIVILEGIADA para conta privilegiada com senha provisória = CPF. Portal do efetivo (2026-11-18): primeiro acesso — se não há conta com o login, há militar ATIVO com este CPF sem conta e a senha digitada é o próprio CPF, cria a conta (papel EFETIVO na unidade do militar, senha provisória); qualquer outra combinação recebe o 401 genérico'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [login, password], properties: { login: { type: string, pattern: '^[A-Za-z0-9._]{1,60}$' }, password: { type: string } } } } } }
      responses: { '200': { description: Perfil }, '401': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' }, '429': { $ref: '#/components/responses/Erro' } }
  /auth/mfa: { post: { security: [], summary: 'PSI-PRB cap. 11 — 2ª etapa do login {codigo} (TOTP ou recuperação; 5 min; 401 MFA_EXPIRADO, 422 CODIGO_INVALIDO)', responses: { '200': { description: Perfil }, '401': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } } }
  /me/password: { post: { summary: 'Trocar a própria senha {senha_atual, nova_senha, nova_senha_confirmation} — regra PSI-PRB 10.1', responses: { '200': { description: Perfil }, '422': { $ref: '#/components/responses/Erro' } } } }
  /me/mfa/setup: { post: { summary: 'Gerar chave TOTP {segredo, uri} (enquanto não confirmada)', responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } } }
  /me/mfa/confirm: { post: { summary: 'Confirmar com {codigo}; devolve 8 códigos de recuperação (uma vez) e o perfil', responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } } }
  /me/mfa: { delete: { summary: 'Desativar o próprio MFA com {codigo} (422 MFA_OBRIGATORIO se o papel exigir)', responses: { '200': { description: Perfil }, '422': { $ref: '#/components/responses/Erro' } } } }
  /me/profile:
    get: { summary: 'Dados funcionais da própria conta (posto, cargo, matrícula, telefone, efetivo vinculado como referência) + lista de postos', responses: { '200': { description: ok } } }
    put: { summary: 'Atualizar só posto_graduacao_id, cargo, matricula, telefone (demais campos ignorados)', responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } }
  /auth/logout: { post: { summary: Encerrar sessão, responses: { '204': { description: ok } } } }
  /me: { get: { summary: Identidade, papéis, permissões efetivas e estado das operações, responses: { '200': { description: Perfil }, '401': { $ref: '#/components/responses/Erro' } } } }
  /me/sessions: { get: { summary: RF-002 Minhas sessões (ref opaca), responses: { '200': { description: lista } } } }
  /me/sessions/{ref}: { delete: { summary: Revogar outra sessão própria, parameters: [{ name: ref, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{16}$' } }], responses: { '204': { description: ok }, '404': { $ref: '#/components/responses/Erro' } } } }
  /dashboard: { get: { summary: RF-024 Indicadores no escopo, responses: { '200': { description: ok } } } }
  /dashboard/materials: { get: { summary: 'Decisão 2026-11-18 — Início por tipo de material (estoque.ver; escopo: armeiro = sua base). grupos[] na ordem ARMA_FOGO, MUNICAO, COLETE, TASER, CARTUCHO_TASER, RADIO, ALGEMA, OUTROS (App\\Support\\GrupoMaterial: código da categoria + perfil do tipo): disponiveis, vencidos, vencendo (validade_dias), tem_validade, com_efetivos, efetivos, entradas_hoje/saidas_hoje, entradas_7_dias/saidas_7_dias (ENTRADA+DEVOLUCAO com destino no escopo; ENTREGA+SAIDA+BAIXA com origem no escopo; horário de Maceió). operacao: entregas_atrasadas e, com pedidos.gerir, pedidos_pendentes, pedidos_aprovados, pendente_mais_antigo. Uma consulta agregada por bloco', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } } }
  /operations: { get: { summary: ADR-006 Portão de políticas, responses: { '200': { description: ok } } } }
  /roles: { get: { summary: Papéis e permissões (proposta), responses: { '200': { description: ok } } } }
  /users:
    get: { summary: RF-004 Listar contas (escopo global), parameters: [{ $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/per_page' }], responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
    post: { summary: 'Criar conta. militar_id obrigatório (efetivo sem conta); se o efetivo tem CPF, tem de ser igual ao login (422 em militar_id)', responses: { '201': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } }
  /users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { summary: Consultar conta, responses: { '200': { description: ok } } }
    put: { summary: 'Atualizar (nome, login, email, militar_id, ativo, … — militar_id obrigatório ao editar dados de conta ainda sem efetivo e não pode ser removido; password, senha_padrao; posto_graduacao_id, cargo, matricula, telefone exigem motivo)', responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } }
  /users/{id}/roles: { post: { summary: 'Atribuir papel (papel, unidade_id|null, expira_em AAAA-MM-DD opcional — delegação P-06; vencida pode ser renovada). Decisão 2026-11-18: ARMEIRO (sigarb.papeis_por_base) exige unidade_id de uma base abaixo da raiz — global ou raiz = 422 ESCOPO_BASE_OBRIGATORIO', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } } }
  /users/{id}/roles/{atribuicao}: { delete: { summary: Remover papel, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: atribuicao, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } } }
  /users/{id}/unlock: { post: { summary: 'PSI-PRB 10.3 — desbloquear conta {motivo} (usuarios.gerir, não a própria)', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } } }
  /users/{id}/mfa/reset: { post: { summary: 'PSI-PRB cap. 11 — redefinir MFA de outra conta {motivo}; encerra sessões', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '204': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } } }
  /users/{id}/sessions/revoke: { post: { summary: Revogar sessões e dispositivos de outra conta, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } } }
  /organizations: { get: { summary: RF-006, responses: { '200': { description: ok } } }, post: { summary: Criar (global), responses: { '201': { description: ok } } } }
  /units: { get: { summary: 'Unidades no escopo de organizacao.ver OU estoque.ver (filtros de quem opera o estoque; decisão 2026-11-18)', responses: { '200': { description: ok } } }, post: { summary: Criar unidade/subunidade, responses: { '201': { description: ok } } } }
  /units/{id}: { put: { summary: Atualizar unidade, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } } }
  /locations: { get: { summary: 'Locais no escopo de organizacao.ver OU estoque.ver (seleção do local de origem; decisão 2026-11-18)', responses: { '200': { description: ok } } }, post: { summary: Criar local, responses: { '201': { description: ok } } } }
  /locations/{id}: { put: { summary: Atualizar local, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } } }
  /militares:
    get: { summary: 'RF-005 Listar (matrícula e CPF mascarados sem ver_detalhe; q busca nome, matrícula exata ou CPF exato; resposta inclui origem FUNCIONARIOS|LOCAL, tem_acesso, cpf e (2026-11-18) sigla_exibicao, rotulo_curto e posto_a_atualizar; posto_a_atualizar=1 filtra RR/PM_ATIVA/BM_ATIVA com posto CIV)', parameters: [{ name: sem_conta, in: query, schema: { type: boolean } }, { name: posto_a_atualizar, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/per_page' }, { name: situacao, in: query, schema: { enum: [ATIVO, AFASTADO, INATIVO] } }], responses: { '200': { description: ok } } }
    post: { summary: 'Cadastrar (cpf opcional, único)', responses: { '201': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } }
  /militares/{id}: { parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], get: { summary: 'Detalhe (CP-12: quadro/função; contatos e observações só com militares.ver_detalhe)', responses: { '200': { description: ok } } }, put: { summary: 'Atualizar (409 UNIDADE_EM_VINCULO_SECUNDARIO)', responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Erro' } } } }
  /militares/{id}/secondary-units:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { summary: CP-12 Vínculos secundários (histórico), responses: { '200': { description: ok } } }
    post: { summary: 'CP-12 Criar vínculo secundário (não amplia escopo; 409 VINCULO_DUPLICADO; 422 UNIDADE_PRINCIPAL/UNIDADE_INVALIDA)', responses: { '201': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } }
  /militares/{id}/secondary-units/{vinculo}/end:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: vinculo, in: path, required: true, schema: { type: integer } }]
    post: { summary: 'CP-12 Encerrar vínculo (fim opcional; 422 PERIODO_INVALIDO; 409 já encerrado)', responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } }
  /catalog/{tipo}:
    parameters: [{ name: tipo, in: path, required: true, schema: { enum: [categorias, fabricantes, calibres, postos-graduacoes, tipos-material, niveis-protecao] } }]
    get: { summary: RF-029 Listas de referência, responses: { '200': { description: ok } } }
    post: { summary: Criar referência (exceto postos), responses: { '201': { description: ok } } }
  /items: { get: { summary: 'RF-007/008/009 Materiais (catalogo.ver OU estoque.ver para listas de seleção; escrita exige catalogo.gerir)', parameters: [{ $ref: '#/components/parameters/q' }, { name: modo_controle, in: query, schema: { enum: [INDIVIDUAL, LOTE] } }], responses: { '200': { description: ok } } }, post: { summary: UC-03 Cadastrar material, responses: { '201': { description: ok } } } }
  /items/{id}: { parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], get: { summary: Detalhe, responses: { '200': { description: ok } } }, put: { summary: Atualizar (modo imutável com estoque → 409), responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Erro' } } } }
  /stock/materials/{material}: { get: { summary: 'Detalhe do material no estoque: catálogo, saldos no escopo, total e atalhos permitidos (pode.*). estoque.ver. local_id opcional restringe saldos e total a um local', parameters: [{ name: material, in: path, required: true, schema: { type: integer } }, { name: local_id, in: query, schema: { type: integer } }], responses: { '200': { description: ok }, '403': { description: sem estoque.ver }, '404': { description: inexistente } } } }
  /stock/origins: { get: { summary: '2026-11-19 — origens (tipo=ENTRADA, padrão; exige estoque.entrada) ou destinações (tipo=SAIDA; exige estoque.saida) já usadas em locais do escopo da permissão (sem depósito oculto). Agrupa sem diferença de maiúsculas/acentos; mais usadas primeiro; até 100. Lista do campo com "Outro…"', parameters: [{ $ref: '#/components/parameters/q' }, { name: tipo, in: query, schema: { enum: [ENTRADA, SAIDA] } }], responses: { '200': { description: 'data [{valor, usos, ultimo_uso}]' }, '403': { $ref: '#/components/responses/Erro' } } } }
  /stock/balances: { get: { summary: 'RF-010 UC-02 Saldos (lote + individual agregado). q também acha nº de série/código de item (palavra por palavra, sem acento); material.tipo no retorno; lotes_disponiveis=1 = só lotes com saldo disponível (formulário de entrega, paginado)', parameters: [{ $ref: '#/components/parameters/q' }, { name: local_id, in: query, schema: { type: integer } }, { name: lotes_disponiveis, in: query, schema: { type: boolean } }, { name: natureza, in: query, schema: { type: string } }, { name: grupo, in: query, description: 'Grupo do Início (2026-11-18)', schema: { enum: [ARMA_FOGO, MUNICAO, COLETE, TASER, CARTUCHO_TASER, RADIO, ALGEMA, OUTROS] } }], responses: { '200': { description: ok } } } }
  /stock/individual-items: { get: { summary: 'Itens individuais (CP-12: filtros de perfil e validade; validade_estado no item). q: série, identificador e nome/código do material (2026-11-18)', parameters: [{ $ref: '#/components/parameters/q' }, { name: local_id, in: query, schema: { type: integer } }, { name: material_id, in: query, schema: { type: integer } }, { name: perfil, in: query, schema: { type: string } }, { name: validade, in: query, schema: { enum: [VENCIDO, VENCENDO, VALIDO, COM_VALIDADE] } }], responses: { '200': { description: ok } } } }
  /stock/individual-items/{id}/conservation:
    patch: { summary: 'CP-12 Atualizar estado de conservação (justificativa obrigatória; não altera a situação operacional — P-03; auditado)', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], requestBody: { content: { application/json: { schema: { type: object, required: [estado_conservacao, justificativa], properties: { estado_conservacao: { enum: [NOVO, BOM, REGULAR, RUIM, DANIFICADO, INSERVIVEL] }, justificativa: { type: string } } } } } }, responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } }
  /stock/individual-items/{id}:
    patch: { summary: 'Decisão 2026-11-16 — corrigir dados do item (numero_serie único por material, validade, fabricado_em, tamanho, nivel_protecao, estado_conservacao) com motivo; identificador gerado nunca muda (identificador = 422); perfil do tipo validado; auditoria item.editado com antes/depois. estoque.editar; fora do escopo 404', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], requestBody: { content: { application/json: { schema: { type: object, required: [motivo], properties: { numero_serie: { type: string, nullable: true }, validade: { type: string, format: date, nullable: true }, fabricado_em: { type: string, format: date, nullable: true }, tamanho: { type: string, nullable: true }, nivel_protecao: { type: string, nullable: true }, estado_conservacao: { enum: [NOVO, BOM, REGULAR, RUIM, DANIFICADO, INSERVIVEL] }, motivo: { type: string, minLength: 10 } } } } } }, responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } }
  /stock/lots/{id}:
    patch: { summary: 'Decisão 2026-11-16 — corrigir código (único por material) e validade do lote, com motivo; vale em todos os locais (exige estoque.editar em todas as unidades com saldo do lote); auditoria lote.editado', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], requestBody: { content: { application/json: { schema: { type: object, required: [motivo], properties: { codigo: { type: string }, validade: { type: string, format: date, nullable: true }, motivo: { type: string, minLength: 10 } } } } } }, responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } }
  /stock/adjustments:
    post: { summary: 'Decisão 2026-11-16 — ajustar a quantidade de um lote num local: grava movimentação AJUSTE imutável (falta = local_origem, sobra = local_destino), idempotente, auditada (estoque.ajuste), sem aprovação. Nunca abaixo da reservada (409 ABAIXO_DA_RESERVA); quantidade_atual opcional (409 SALDO_ALTERADO se mudou); igual = 422 SEM_ALTERACAO. Portão INVENTARIO; estoque.editar', parameters: [{ $ref: '#/components/parameters/idem' }], requestBody: { content: { application/json: { schema: { type: object, required: [local_id, lote_id, quantidade, motivo], properties: { local_id: { type: integer }, lote_id: { type: integer }, quantidade: { type: integer, minimum: 0 }, quantidade_atual: { type: integer }, motivo: { type: string, minLength: 10 }, documento_referencia: { type: string } } } } } }, responses: { '201': { description: Criada }, '200': { description: 'Replay idempotente' }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' }, '428': { $ref: '#/components/responses/Erro' } } }
  /stock/linked:
    get: { summary: 'CP-12 RF-VIN-06 Material com efetivos (acautelamentos + entregas com retorno pendentes, descontadas as devoluções parciais), filtrado no escopo. Decisão 2026-11-18: UMA linha por entrega (custodia+origem) com itens[], total_itens, quantidade_total, conservacao (estado→quantidade), pedido {codigo, comprovante}, entrega_id, previsao_retorno, atrasado e pode_receber; paginação por entrega; os filtros escolhem a entrega e a linha traz a entrega inteira. q aceita efetivo, material, série, lote, nº da entrega (1183 ou #1183), comprovante do pedido (PED-XXXXXX ou código completo) e matrícula/CPF exatos onde a matrícula completa é visível. 2026-11-18: busca palavra por palavra, parcial, sem acento (material nome/código/tipo, efetivo, série, identificador, lote); lote traz situacao=ENTREGUE, quantidade (pendente), quantidade_entregue e quantidade_devolvida; militar.posto = sigla de exibição (CIV → RR/PM/BM/VIG/R1)', parameters: [{ name: q, in: query, schema: { type: string } }, { name: entrega_id, in: query, schema: { type: integer } }, { name: per_page, in: query, schema: { type: integer, maximum: 100 } }, { name: material_id, in: query, schema: { type: integer } }, { name: atrasados, in: query, schema: { type: boolean } }, { name: militar_id, in: query, schema: { type: integer } }, { name: unidade_id, in: query, schema: { type: integer } }, { name: categoria_id, in: query, schema: { type: integer } }, { name: tipo_id, in: query, schema: { type: integer } }, { name: perfil, in: query, schema: { type: string } }, { name: modo_controle, in: query, schema: { enum: [INDIVIDUAL, LOTE] } }, { name: custodia, in: query, schema: { enum: [ACAUTELAMENTO, ENTREGA] } }, { name: situacao, in: query, schema: { enum: [ACAUTELADO, ENTREGUE, MANUTENCAO, RESERVADO] } }, { name: grupo, in: query, description: 'Grupo do Início (2026-11-18)', schema: { enum: [ARMA_FOGO, MUNICAO, COLETE, TASER, CARTUCHO_TASER, RADIO, ALGEMA, OUTROS] } }], responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } }
  /stock/linked/recipients:
    get: { summary: 'Decisão 2026-11-18 — Devolução de material já aberta: uma linha por EFETIVO com material pendente no escopo (estoque.ver): militar (sigla de exibição, nome, aptidão), entregas, itens, lotes, quantidade_lotes, mais_antiga, proxima_previsao, atrasadas, atrasado. Ordem: atrasados, previsão mais próxima (sem previsão ao fim), mais antiga. q = mesma busca do balcão de /stock/linked. Uma consulta agrupada', parameters: [{ name: q, in: query, schema: { type: string } }, { $ref: '#/components/parameters/page' }, { name: per_page, in: query, schema: { type: integer, maximum: 50 } }], responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
  /stock/recipients:
    get: { summary: 'Decisão 2026-11-18 — busca de efetivo do balcão (entrega, acautelamento; resposta com sigla_exibicao e rotulo_curto) sem a tela Efetivos. Exige estoque.entregar, acautelamento.solicitar ou pedidos.gerir; só efetivos ATIVOS no escopo dessas permissões. q (mín. 2): nome, nome de guerra, matrícula ou CPF exatos (onde a matrícula completa é visível). Sem contatos; CPF mascarado', parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 2 } }, { name: per_page, in: query, schema: { type: integer, maximum: 20 } }], responses: { '200': { description: '{ data: Efetivo[] }' }, '403': { $ref: '#/components/responses/Erro' } } }
  /stock/delivery-options:
    get: { summary: 'Decisão 2026-11-18 — listas fechadas do formulário Registrar entrega (documentos e motivos: codigo, rotulo, descricao; config sigarb.entrega) e local_origem_padrao_id (SIGARB_ENTREGA_LOCAL_PADRAO, ou o primeiro local RESERVA ativo da base). Exige estoque.entregar', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
  /movements:
    get: { summary: 'RF-027 Razão (filtros tipo, local, período, item, lote, material_id). Decisão 2026-11-18: exige movimentacoes.ver (telas Movimentações e Operações e pendências) além de estoque.ver; o detalhe /movements/{id} continua com estoque.ver', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
    post:
      summary: 'UC-04 Registrar ENTRADA e as operações habilitadas (ENTREGA, DEVOLUCAO, BAIXA…). DEVOLUCAO (decisão 2026-11-16) aceita ainda ocorrido_em (retroativa exige justificativa; nunca antes da entrega), quem devolve = sempre o efetivo da entrega (regra 2026-11-18: devolvido_por_nome ou devolvido_por_militar_id de outro efetivo → 422 DEVOLUCAO_SO_PELO_EFETIVO) e itens[].estado_conservacao; o estado de cada item fica em movimentacao_itens.estado_conservacao/estado_anterior e o detalhe devolve devolvido_por e entrega_id'
      parameters: [{ $ref: '#/components/parameters/idem' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Entrada' } } } }
      responses: { '201': { description: Criada }, '200': { description: 'Replay idempotente (Idempotent-Replayed: true)' }, '403': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Bloqueada' }, '422': { $ref: '#/components/responses/Erro' }, '428': { $ref: '#/components/responses/Erro' } }
  /movements/{id}: { get: { summary: 'Detalhe com itens e pode_estornar; lote de ENTREGA/DEVOLUCAO traz situacao_lote {situacao ENTREGUE|DEVOLVIDO_PARCIAL|DEVOLVIDO|CONSUMIDO, entregue, devolvido, pendente} (2026-11-18); item e lote de ENTREGA/DEVOLUCAO trazem situacao_na_entrega {codigo ENTREGUE|DEVOLVIDO|DEVOLVIDO_PARCIAL|CONSUMIDO|BAIXADO_APOS_DEVOLUCAO, rotulo, entregue, devolvido, pendente, hoje?} — situação relativa à entrega pelo vínculo devolução↔entrega (também em /stock/linked e /portal); local tipo DEPOSITO sem estoque.depositos → 403 DEPOSITO_SO_GESTAO', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } } }
  /movements/{id}/reversal:
