  /reports/deliveries-returns: { get: { summary: 'Decisão 2026-11-18 — relatório do armeiro (relatorios.entregas): quantidades ENTREGUES (ENTREGA com efetivo, inclui acautelamento) e DEVOLVIDAS (DEVOLUCAO, inclui desacautelamento) por período, separadas em armas (perfil ARMA_FOGO), munição (natureza MUNICAO) e demais; item individual = 1, lote = quantidade. agrupar=dia|semana|mes, de, ate (máx. 400 dias; padrão: 14 dias/8 semanas/12 meses), unidade_id. Escopo pela unidade do local da movimentação. Resposta: series[{rotulo, inicio, fim, armas|municao|demais: {entregues, devolvidas}}], totais', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } } }
