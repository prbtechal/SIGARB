  /data-transfer: { get: { summary: 'CP-13 — cadastros que o usuário pode importar/exportar, com as colunas do modelo; 403 sem dados.importar nem relatorios.exportar (2026-11-18)', responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } } }
