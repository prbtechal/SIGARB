openapi: 3.1.0
info:
  title: SIGARB API
  version: 0.1.0-mvp
  description: |
    API do MVP (ambiente NÃO produtivo). Autenticação por cookie de sessão (grupo "web" do Laravel).
    Escritas exigem cabeçalho X-XSRF-TOKEN (valor do cookie XSRF-TOKEN; obter em GET /csrf).
    Escritas de estoque exigem Idempotency-Key. Erros: objeto `error` padronizado.
servers: [{ url: /api/v1 }]
security: [{ sessao: [] }]
components:
  securitySchemes:
    sessao: { type: apiKey, in: cookie, name: sigarb-session }
  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    per_page: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    q: { name: q, in: query, schema: { type: string, maxLength: 80 } }
    idem: { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9-]{16,80}$' } }
  schemas:
    Erro:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [VALIDACAO, NAO_AUTENTICADO, CONTA_INATIVA, CREDENCIAIS_INVALIDAS, MUITAS_TENTATIVAS, ACESSO_NEGADO, NAO_ENCONTRADO, CSRF_INVALIDO, OPERACAO_BLOQUEADA, IDEMPOTENCY_KEY_OBRIGATORIA, IDEMPOTENCIA_CONFLITO, IDENTIFICADOR_DUPLICADO, SALDO_INSUFICIENTE, JA_ESTORNADA, ESTORNO_INVALIDO, ESTORNO_IMPEDIDO, MODO_CONTROLE_IMUTAVEL, LOCAL_INATIVO, ERRO_INTERNO] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
            details: { type: object }
            request_id: { type: string }
    Meta: { type: object, properties: { page: { type: integer }, per_page: { type: integer }, total: { type: integer }, last_page: { type: integer } } }
    Entrada:
      type: object
      required: [tipo, local_destino_id, origem_descricao, documento_referencia, itens]
      properties:
        tipo: { type: string, enum: [ENTRADA], description: 'Outros tipos → 409 OPERACAO_BLOQUEADA' }
        local_destino_id: { type: integer }
        origem_descricao: { type: string, minLength: 3, maxLength: 255 }
        documento_referencia: { type: string, minLength: 3, maxLength: 120 }
        justificativa: { type: [string, 'null'], maxLength: 500, description: 'Obrigatória quando ocorrido_em é retroativa' }
        ocorrido_em: { type: [string, 'null'], format: date-time, description: 'Data/hora real da entrada (com fuso). Ausente = agora. Até 5 min no futuro; anterior a 5 min atrás = retroativa (exige justificativa, auditada)' }
        itens:
          type: array
          minItems: 1
          maxItems: 200
          items:
            oneOf:
              - { title: Individual, type: object, required: [material_id], description: 'identificador é gerado pelo sistema (prefixo da categoria + sequência, ex.: ARM-000001); enviá-lo → 422', properties: { material_id: { type: integer }, numero_serie: { type: [string, 'null'] }, estado_conservacao: { enum: [NOVO, BOM, REGULAR, RUIM] } } }
              - { title: Lote, type: object, required: [material_id, lote_codigo, quantidade], properties: { material_id: { type: integer }, lote_codigo: { type: string }, validade: { type: [string, 'null'], format: date }, quantidade: { type: integer, minimum: 1 } } }
  responses:
    Erro: { description: Erro padronizado, content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }
    Bloqueada: { description: 'Operação bloqueada por pendência institucional (OPERACAO_BLOQUEADA)', content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }
paths:
  /csrf: { get: { security: [], summary: Emite cookie XSRF-TOKEN, responses: { '204': { description: ok } } } }
  /auth/login:
    post:
      security: []
      summary: 'RF-001 Autenticar (emite cookie de sessão e de dispositivo confiável). Com MFA ativo devolve {mfa_requerido: true} sem sessão; conta bloqueada (PSI-PRB 10.3) recebe o mesmo 401 genérico; 403 SENHA_CPF_PRIVILEGIADA para conta privilegiada com senha provisória = CPF'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [login, password], properties: { login: { type: string, pattern: '^[A-Za-z0-9._]{1,60}$' }, password: { type: string } } } } } }
      responses: { '200': { description: Perfil }, '401': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' }, '429': { $ref: '#/components/responses/Erro' } }
  /auth/mfa: { post: { security: [], summary: 'PSI-PRB cap. 11 — 2ª etapa do login {codigo} (TOTP ou recuperação; 5 min; 401 MFA_EXPIRADO, 422 CODIGO_INVALIDO)', responses: { '200': { description: Perfil }, '401': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } } }
  /me/password: { post: { summary: 'Trocar a própria senha {senha_atual, nova_senha, nova_senha_confirmation} — regra PSI-PRB 10.1', responses: { '200': { description: Perfil }, '422': { $ref: '#/components/responses/Erro' } } } }
  /me/mfa/setup: { post: { summary: 'Gerar chave TOTP {segredo, uri} (enquanto não confirmada)', responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } } }
  /me/mfa/confirm: { post: { summary: 'Confirmar com {codigo}; devolve 8 códigos de recuperação (uma vez) e o perfil', responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } } }
  /me/mfa: { delete: { summary: 'Desativar o próprio MFA com {codigo} (422 MFA_OBRIGATORIO se o papel exigir)', responses: { '200': { description: Perfil }, '422': { $ref: '#/components/responses/Erro' } } } }
  /me/profile:
    get: { summary: 'Dados funcionais da própria conta (posto, cargo, matrícula, telefone, efetivo vinculado como referência) + lista de postos', responses: { '200': { description: ok } } }
    put: { summary: 'Atualizar só posto_graduacao_id, cargo, matricula, telefone (demais campos ignorados)', responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } }
  /auth/logout: { post: { summary: Encerrar sessão, responses: { '204': { description: ok } } } }
  /me: { get: { summary: Identidade, papéis, permissões efetivas e estado das operações, responses: { '200': { description: Perfil }, '401': { $ref: '#/components/responses/Erro' } } } }
  /me/sessions: { get: { summary: RF-002 Minhas sessões (ref opaca), responses: { '200': { description: lista } } } }
  /me/sessions/{ref}: { delete: { summary: Revogar outra sessão própria, parameters: [{ name: ref, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{16}$' } }], responses: { '204': { description: ok }, '404': { $ref: '#/components/responses/Erro' } } } }
  /dashboard: { get: { summary: RF-024 Indicadores no escopo, responses: { '200': { description: ok } } } }
  /operations: { get: { summary: ADR-006 Portão de políticas, responses: { '200': { description: ok } } } }
  /roles: { get: { summary: Papéis e permissões (proposta), responses: { '200': { description: ok } } } }
  /users:
    get: { summary: RF-004 Listar contas (escopo global), parameters: [{ $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/per_page' }], responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } }
    post: { summary: Criar conta, responses: { '201': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } }
  /users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { summary: Consultar conta, responses: { '200': { description: ok } } }
    put: { summary: 'Atualizar (nome, login, email, militar_id, ativo, password, senha_padrao; posto_graduacao_id, cargo, matricula, telefone exigem motivo)', responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } }
  /users/{id}/roles: { post: { summary: 'Atribuir papel (papel, unidade_id|null, expira_em AAAA-MM-DD opcional — delegação P-06; vencida pode ser renovada)', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } } }
  /users/{id}/roles/{atribuicao}: { delete: { summary: Remover papel, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: atribuicao, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } } }
  /users/{id}/unlock: { post: { summary: 'PSI-PRB 10.3 — desbloquear conta {motivo} (usuarios.gerir, não a própria)', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } } }
  /users/{id}/mfa/reset: { post: { summary: 'PSI-PRB cap. 11 — redefinir MFA de outra conta {motivo}; encerra sessões', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '204': { description: ok }, '403': { $ref: '#/components/responses/Erro' } } } }
  /users/{id}/sessions/revoke: { post: { summary: Revogar sessões e dispositivos de outra conta, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } } }
  /organizations: { get: { summary: RF-006, responses: { '200': { description: ok } } }, post: { summary: Criar (global), responses: { '201': { description: ok } } } }
  /units: { get: { summary: Unidades no escopo, responses: { '200': { description: ok } } }, post: { summary: Criar unidade/subunidade, responses: { '201': { description: ok } } } }
  /units/{id}: { put: { summary: Atualizar unidade, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } } }
  /locations: { get: { summary: Locais no escopo, responses: { '200': { description: ok } } }, post: { summary: Criar local, responses: { '201': { description: ok } } } }
  /locations/{id}: { put: { summary: Atualizar local, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } } }
  /militares:
    get: { summary: RF-005 Listar (matrícula mascarada sem ver_detalhe), parameters: [{ $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/per_page' }, { name: situacao, in: query, schema: { enum: [ATIVO, AFASTADO, INATIVO] } }], responses: { '200': { description: ok } } }
    post: { summary: Cadastrar, responses: { '201': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } }
  /militares/{id}: { parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], get: { summary: 'Detalhe (CP-12: quadro/função; contatos e observações só com militares.ver_detalhe)', responses: { '200': { description: ok } } }, put: { summary: 'Atualizar (409 UNIDADE_EM_VINCULO_SECUNDARIO)', responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Erro' } } } }
  /militares/{id}/secondary-units:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { summary: CP-12 Vínculos secundários (histórico), responses: { '200': { description: ok } } }
    post: { summary: 'CP-12 Criar vínculo secundário (não amplia escopo; 409 VINCULO_DUPLICADO; 422 UNIDADE_PRINCIPAL/UNIDADE_INVALIDA)', responses: { '201': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } }
  /militares/{id}/secondary-units/{vinculo}/end:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: vinculo, in: path, required: true, schema: { type: integer } }]
    post: { summary: 'CP-12 Encerrar vínculo (fim opcional; 422 PERIODO_INVALIDO; 409 já encerrado)', responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } }
  /catalog/{tipo}:
    parameters: [{ name: tipo, in: path, required: true, schema: { enum: [categorias, fabricantes, calibres, postos-graduacoes, tipos-material, niveis-protecao] } }]
    get: { summary: RF-029 Listas de referência, responses: { '200': { description: ok } } }
    post: { summary: Criar referência (exceto postos), responses: { '201': { description: ok } } }
  /items: { get: { summary: RF-007/008/009 Materiais, parameters: [{ $ref: '#/components/parameters/q' }, { name: modo_controle, in: query, schema: { enum: [INDIVIDUAL, LOTE] } }], responses: { '200': { description: ok } } }, post: { summary: UC-03 Cadastrar material, responses: { '201': { description: ok } } } }
  /items/{id}: { parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], get: { summary: Detalhe, responses: { '200': { description: ok } } }, put: { summary: Atualizar (modo imutável com estoque → 409), responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Erro' } } } }
  /stock/materials/{material}: { get: { summary: 'Detalhe do material no estoque: catálogo, saldos no escopo, total e atalhos permitidos (pode.*). estoque.ver', parameters: [{ name: material, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok }, '403': { description: sem estoque.ver }, '404': { description: inexistente } } } }
  /stock/balances: { get: { summary: RF-010 UC-02 Saldos (lote + individual agregado), parameters: [{ $ref: '#/components/parameters/q' }, { name: local_id, in: query, schema: { type: integer } }, { name: natureza, in: query, schema: { type: string } }], responses: { '200': { description: ok } } } }
  /stock/individual-items: { get: { summary: 'Itens individuais (CP-12: filtros de perfil e validade; validade_estado no item)', parameters: [{ $ref: '#/components/parameters/q' }, { name: local_id, in: query, schema: { type: integer } }, { name: material_id, in: query, schema: { type: integer } }, { name: perfil, in: query, schema: { type: string } }, { name: validade, in: query, schema: { enum: [VENCIDO, VENCENDO, VALIDO, COM_VALIDADE] } }], responses: { '200': { description: ok } } } }
  /stock/individual-items/{id}/conservation:
    patch: { summary: 'CP-12 Atualizar estado de conservação (justificativa obrigatória; não altera a situação operacional — P-03; auditado)', parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], requestBody: { content: { application/json: { schema: { type: object, required: [estado_conservacao, justificativa], properties: { estado_conservacao: { enum: [NOVO, BOM, REGULAR, RUIM, DANIFICADO, INSERVIVEL] }, justificativa: { type: string } } } } } }, responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' }, '422': { $ref: '#/components/responses/Erro' } } }
  /stock/linked:
    get: { summary: 'CP-12 RF-VIN-06 Material vinculado ao efetivo (acautelamentos + entregas provisórias), filtrado no escopo', parameters: [{ name: militar_id, in: query, schema: { type: integer } }, { name: unidade_id, in: query, schema: { type: integer } }, { name: categoria_id, in: query, schema: { type: integer } }, { name: tipo_id, in: query, schema: { type: integer } }, { name: perfil, in: query, schema: { type: string } }, { name: modo_controle, in: query, schema: { enum: [INDIVIDUAL, LOTE] } }, { name: custodia, in: query, schema: { enum: [ACAUTELAMENTO, ENTREGA] } }, { name: situacao, in: query, schema: { enum: [ACAUTELADO, ENTREGUE, MANUTENCAO, RESERVADO] } }], responses: { '200': { description: ok }, '422': { $ref: '#/components/responses/Erro' } } }
  /movements:
    get: { summary: RF-027 Razão (filtros tipo, local, período, item, lote, material_id), responses: { '200': { description: ok } } }
    post:
      summary: UC-04 Registrar ENTRADA (demais tipos bloqueados)
      parameters: [{ $ref: '#/components/parameters/idem' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Entrada' } } } }
      responses: { '201': { description: Criada }, '200': { description: 'Replay idempotente (Idempotent-Replayed: true)' }, '403': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Bloqueada' }, '422': { $ref: '#/components/responses/Erro' }, '428': { $ref: '#/components/responses/Erro' } }
  /movements/{id}: { get: { summary: Detalhe com itens e pode_estornar, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } } }
  /movements/{id}/reversal:
    post:
      summary: RN-018 Estornar entrada
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/idem' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [justificativa], properties: { justificativa: { type: string, minLength: 10, maxLength: 500 } } } } } }
      responses: { '201': { description: ok }, '409': { $ref: '#/components/responses/Erro' } }
  /audit-events: { get: { summary: 'RF-025 UC-14 Trilha (filtros acao, resultado, usuario_id, recurso, período). Campos aditivos de apresentação: acao_rotulo, frase, recurso_rotulo, recurso_link, unidade_rotulo (alvo genérico "Tipo #id" sem acesso ao recurso)', responses: { '200': { description: ok } } } }
  /audit-events/actions: { get: { summary: 'Ações conhecidas com rótulo em português (auditoria.ver)', responses: { '200': { description: ok }, '403': { description: sem permissão } } } }
  /audit-events/integrity: { get: { summary: Verificação da cadeia de hash (auditor global), responses: { '200': { description: ok } } } }
  # Regras PROVISÓRIAS (desligadas por padrão; SIGARB_OPERACOES_PROVISORIAS). Desligadas: 409 OPERACAO_BLOQUEADA.
  # POST /movements também aceita tipo SAIDA|BAIXA|TRANSFERENCIA|RESERVA|MANUTENCAO|ENTREGA (local_origem_id, itens[item_individual_id|lote_id+quantidade],
  # justificativa, documento_referencia, destinacao, local_destino_id, militar_id, previsao_retorno) e RECEBIMENTO|LIBERACAO_RESERVA|RETORNO_MANUTENCAO|DEVOLUCAO (vinculo_id).
  # CP-13: DEVOLUCAO aceita itens opcionais [{item_individual_id, estado_conservacao?} | {lote_id, quantidade}] (parcial; 422 ITEM_INVALIDO/QUANTIDADE_EXCEDIDA); sem itens devolve o restante.
  # CP-13: ENTREGA/RESERVA recusam material vencido (409 ITEM_VENCIDO) ou inservível (409 ITEM_INSERVIVEL). GET /movements/{id} de ENTREGA traz pendente_devolucao.
  # GET /movements?pendente=1 lista aberturas sem conclusão.
  /transfers: { post: { summary: 'RF-012 — envio (equivale a POST /movements tipo TRANSFERENCIA); regra provisória', responses: { '201': { description: criada }, '409': { $ref: '#/components/responses/Bloqueada' } } } }
  /acautelamentos: { get: { summary: 'RF-015 — lista no escopo (estado, inspecao_vencendo)', responses: { '200': { description: ok } } } }
  /acautelamentos/requests: { post: { summary: 'UC-06 — solicitar (militar_id, item_individual_id, justificativa); regra provisória', responses: { '201': { description: criada }, '409': { $ref: '#/components/responses/Bloqueada' } } } }
  /acautelamentos/{codigo}: { get: { summary: 'Detalhe com fluxo e ações permitidas', parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }], responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } } }
  /acautelamentos/{codigo}/decision: { post: { summary: 'UC-07 — APROVAR|REJEITAR (justificativa na rejeição); quem pediu não decide', parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }], requestBody: { content: { application/json: { schema: { type: object, required: [versao], properties: { versao: { type: integer } } } } } }, responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } } }
  /acautelamentos/{codigo}/cancel: { post: { summary: 'Cancelar (justificativa)', parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }], requestBody: { content: { application/json: { schema: { type: object, required: [versao], properties: { versao: { type: integer } } } } } }, responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } } }
  /acautelamentos/{codigo}/delivery: { post: { summary: 'UC-08 — entrega após aprovação; gera carteira', parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }], requestBody: { content: { application/json: { schema: { type: object, required: [versao], properties: { versao: { type: integer } } } } } }, responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } } }
  /acautelamentos/{codigo}/inspections: { post: { summary: 'UC-09 — CONFORME|NAO_CONFORME (observação obrigatória se não conforme)', parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }], requestBody: { content: { application/json: { schema: { type: object, required: [versao], properties: { versao: { type: integer } } } } } }, responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } } }
  /acautelamentos/{codigo}/return: { post: { summary: 'UC-10 — desacautelar (estado_conservacao, divergencias); revoga carteira', parameters: [{ name: codigo, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }], requestBody: { content: { application/json: { schema: { type: object, required: [versao], properties: { versao: { type: integer } } } } } }, responses: { '200': { description: ok }, '403': { $ref: '#/components/responses/Erro' }, '404': { $ref: '#/components/responses/Erro' }, '409': { $ref: '#/components/responses/Erro' } } } }
