# SIGARB — ambiente LOCAL de desenvolvimento/demonstração com dados sintéticos.
# Nunca apontar para bancos institucionais. Projeto Compose isolado: "sigarb-dev".
name: sigarb-dev
services:
  mysql:
    image: mysql:8.4
    container_name: sigarb-dev-mysql
    command: ["--skip-log-bin", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${SIGARB_DB_ROOT_PASSWORD:?defina em infra/.env}
      MYSQL_DATABASE: sigarb
      MYSQL_USER: sigarb
      MYSQL_PASSWORD: ${SIGARB_DB_PASSWORD:?defina em infra/.env}
    ports: ["127.0.0.1:${SIGARB_MYSQL_PORT:-18406}:3306"]
    volumes:
      - sigarb-mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${SIGARB_DB_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30
    deploy: { resources: { limits: { memory: 768m } } }
  api:
    build: { context: ./php }
    image: sigarb-dev-php:local
    container_name: sigarb-dev-api
    working_dir: /app/public
    # php -S preserva o ambiente do container (artisan serve não repassa DB_* ao processo filho)
    command: ["php", "-S", "0.0.0.0:8000", "../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${SIGARB_DB_PASSWORD}
      SIGARB_DEMO_PASSWORD: ${SIGARB_DEMO_PASSWORD:-}
      PHP_CLI_SERVER_WORKERS: "4"
    volumes: ["../backend:/app"]
    ports: ["127.0.0.1:${SIGARB_API_PORT:-18480}:8000"]
    depends_on: { mysql: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 512m } } }
  # API isolada para E2E (banco sigarb_e2e, recriado a cada execução). Ativada com --profile e2e.
  api-e2e:
    image: sigarb-dev-php:local
    container_name: sigarb-e2e-api
    profiles: ["e2e"]
    working_dir: /app/public
    # php -S preserva o ambiente do container (artisan serve não repassa DB_* ao processo filho)
    command: ["php", "-S", "0.0.0.0:8000", "../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]
    environment:
      DB_HOST: mysql
      DB_DATABASE: sigarb_e2e
      DB_USERNAME: ${SIGARB_E2E_DB_USER:-sigarb}
      DB_PASSWORD: ${SIGARB_E2E_DB_PASSWORD:-${SIGARB_DB_PASSWORD}}
      SIGARB_DEMO_PASSWORD: ${SIGARB_DEMO_PASSWORD:-}
      # Regras provisórias ligadas só no E2E (desligadas por padrão no dev e na release).
      SIGARB_OPERACOES_PROVISORIAS: ${SIGARB_E2E_OPERACOES_PROVISORIAS-SAIDA,BAIXA,TRANSFERENCIA,RESERVA,MANUTENCAO,ENTREGA,DEVOLUCAO,ACAUTELAMENTO,INSPECAO,DESACAUTELAMENTO}
      CACHE_STORE: database
      APP_DEBUG: "false"
      PHP_CLI_SERVER_WORKERS: "4"
    volumes: ["../backend:/app"]
    ports: ["127.0.0.1:18482:8000"]
    depends_on: { mysql: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 512m } } }
volumes:
  sigarb-mysql:
    name: sigarb-dev-mysql-data
