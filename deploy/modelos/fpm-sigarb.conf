; SIGARB — pool PHP-FPM dedicado na VM .8 (MODELO). /etc/php/8.5/fpm/pool.d/sigarb.conf
; Identidade própria; não altera o pool "www" do Escalas. Aplicar com `php-fpm8.5 -t` e RELOAD (nunca restart).
[sigarb]
user = sigarb
group = sigarb
listen = /run/php/sigarb.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; 2 vCPU compartilhadas com Escalas/RS/VS: ondemand com teto baixo (CPU-bound, ver CAPACIDADE.md).
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 35s
request_slowlog_timeout = 2s
slowlog = /var/log/php-fpm/sigarb-lento.log
php_admin_value[error_log] = /var/log/php-fpm/sigarb.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 192M
php_admin_value[upload_max_filesize] = 11M
php_admin_value[post_max_size] = 12M
php_admin_value[open_basedir] = /var/www/app/sigarb/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_value[opcache.validate_timestamps] = 0
php_admin_flag[expose_php] = off
; Saúde/estado do pool só local
pm.status_path = /fpm-status-sigarb
