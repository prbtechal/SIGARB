[www]
; Processos limitados ao orçamento de memória do container (ver CAPACIDADE.md). Ajustado por medição.
pm = static
pm.max_children = ${SIGARB_FPM_FILHOS}
pm.max_requests = 1000
pm.status_path = /fpm-status
request_slowlog_timeout = 2s
slowlog = /proc/self/fd/2
request_terminate_timeout = 35s
catch_workers_output = yes
clear_env = no
